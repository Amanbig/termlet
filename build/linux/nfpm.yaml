name: "termlet"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "devel"
priority: "optional"
maintainer: "Amanbig <amanpreetsinghjhiwant@outlook.com>"
description: "Modern Remote SSH File Editor & Terminal Suite"
homepage: "https://github.com/Amanbig/termlet"
license: "Apache-2.0"

contents:
  - src: ../bin/termlet
    dst: /usr/bin/termlet
    file_info:
      mode: 0755
  - src: termlet.desktop
    dst: /usr/share/applications/termlet.desktop
  - src: ../appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/termlet.png

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
