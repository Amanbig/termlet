name: termlet
base: core22
adopt-info: termlet
summary: Modern Cross-Platform SSH Client, SFTP File Browser & Remote Editor
description: |
  Termlet is a fast, lightweight desktop SSH client featuring a built-in
  SFTP dual-pane file manager, remote code editor, local port forwarding,
  and interactive multi-tab remote terminal drawer.

grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  termlet:
    command: bin/termlet
    desktop: usr/share/applications/termlet.desktop
    extensions: [gnome]
    environment:
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
    plugs:
      - network
      - network-bind
      - ssh-keys
      - home
      - browser-support
      - removable-media

parts:
  termlet:
    plugin: nil
    source: .
    build-snaps:
      - go/latest/stable
      - node/20/stable
    build-packages:
      - build-essential
      - pkg-config
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
    override-build: |
      # 1. Determine version from git tag
      VERSION=$(git describe --tags --always 2>/dev/null | sed 's/^v//')
      if [ -z "$VERSION" ]; then
        VERSION="0.9.0"
      fi
      craftctl set version="$VERSION"

      # 2. Setup Go paths outside the source directory to prevent Go from scanning GOPATH/pkg/mod
      export GOPATH=/tmp/go
      export GOCACHE=/tmp/gocache
      export PATH="$GOPATH/bin:$PATH"
      go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # 3. Build Wails app with WebKitGTK 4.1
      wails build -tags webkit2_41 -platform linux/amd64 -ldflags "-X 'termlet/internal/version.Version=v$VERSION'"

      # 4. Install binary
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      cp build/bin/termlet "$SNAPCRAFT_PART_INSTALL/bin/termlet"

      # 5. Install desktop entry
      mkdir -p "$SNAPCRAFT_PART_INSTALL/usr/share/applications"
      sed 's|Exec=.*|Exec=termlet|g' build/linux/termlet.desktop > "$SNAPCRAFT_PART_INSTALL/usr/share/applications/termlet.desktop"

      # 6. Install icon
      mkdir -p "$SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps"
      cp build/appicon.png "$SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/termlet.png"
